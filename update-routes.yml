name: 每日更新巴士路線資料

on:
  schedule:
    - cron: '23 3 * * *'   # 每天香港時間 11:23（UTC 03:23）
  workflow_dispatch:       # 亦可在 GitHub 頁面手動按「Run workflow」

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取最新路線（data.gov.hk）
        run: python3 scripts/update_routes.py

      - name: 有更新就提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/routes.json
          if git diff --quiet --cached; then
            echo "路线数据无变化，跳过提交"
          else
            git commit -m "chore(data): 更新巴士路線資料 $(date +'%Y-%m-%d')"
            git push
          fi
